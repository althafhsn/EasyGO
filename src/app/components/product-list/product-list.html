<!-- product-list.html -->
<div class="flex flex-wrap items-center justify-center gap-4 mt-8 px-6 md:px-16 lg:px-24 xl:px-32">
  <input type="text" [(ngModel)]="searchText" placeholder="Search products"
    class="border border-gray-300 rounded-full px-4 py-1.5 text-sm outline-none" />
  <p class="text-sm text-gray-500">Searching for: {{ searchText }}</p>

  <input #productInput type="text" placeholder="Type a product name"
    class="border border-gray-300 rounded-full px-4 py-1.5 text-sm outline-none" />
  <button (click)="showProduct(productInput.value)"
    class="text-sm text-indigo-600 border border-indigo-200 hover:bg-indigo-50 transition cursor-pointer rounded-full px-4 py-1.5">
    Show Product
  </button>
</div>

<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-x-4 gap-y-10 w-full mt-10 px-6 md:px-16 lg:px-24 xl:px-32">
  @for (product of products; track product.id) {
    <div class="flex justify-center">
      <app-product-card
        [productName]="product.name"
        [price]="product.price"
        [imageUrl]="product.imageUrl"
        [inStock]="product.inStock"
        (addToCart)="onAddToCart($event)">
      </app-product-card>
    </div>
  }
</div>
